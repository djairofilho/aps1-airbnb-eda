site_name: Projeto de Machine Learning — Airbnb NYC
site_description: EDA e regressão do preço anunciado dos anúncios Airbnb em Nova York em 2019
site_author: Djairo Dantas da Silva Filho
site_url: https://djairofilho.github.io/aps-airbnb-eda/
repo_url: https://github.com/djairofilho/aps-airbnb-eda
repo_name: djairofilho/aps-airbnb-eda

theme:
  name: material
  language: pt-BR
  palette:
    primary: indigo
    accent: teal
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy

nav:
  - Visão geral: index.md
  - APS1 — exploração dos dados:
      - Visão da APS1: aps1.md
      - Dados e pergunta: dados.md
      - Qualidade e vieses: qualidade.md
      - Resultados da EDA: resultados.md
      - Pré-processamento: preprocessamento.md
      - PCA: pca.md
      - Limitações: limitacoes.md
      - Notebook completo: notebook.md
      - Checklist da APS1: checklist.md
  - APS2 — modelagem e avaliação:
      - Protocolo e comparação: aps2/index.md
      - Avaliação no teste: aps2/avaliacao.md
      - Interpretação e discussão: aps2/interpretacao.md
      - Revisão e checklist: aps2/revisao.md
      - Notebook completo: aps2/notebook.md
  - Como reproduzir: reproducao.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search:
      lang: pt
