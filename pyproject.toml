[project]
name = "aps-airbnb-eda"
version = "0.1.0"
description = "Exploração e regressão do preço anunciado dos anúncios do Airbnb em Nova York"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kagglehub",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "shap>=0.51.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "nbconvert",
    "nbformat",
]

[tool.uv]
package = false
